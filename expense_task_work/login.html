<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Expense Tracker Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <script src="login.js"></script>

</body>

</html>
