<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Cashfree Checkout SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Premium Membership -->
    <div class="card shadow mb-4 border-warning">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1">Premium Membership</h5>
                <p id="premiumText" class="mb-0 text-muted">
                    Unlock Premium for ₹499
                </p>
            </div>

            <button
                id="premiumBtn"
                type="button"
                class="btn btn-warning"
            >
                Buy Premium
            </button>
        </div>
    </div>

    <!-- Premium Leaderboard -->
    <div id="leaderboardSection" class="card shadow mb-4 d-none">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Premium User Leaderboard</h5>
            <button id="refreshLeaderboardBtn" class="btn btn-sm btn-light">Refresh</button>
        </div>
        <div class="card-body">
            <p class="text-muted mb-3">Users ranked by their total expenses.</p>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Rank</th>
                            <th>User</th>
                            <th>Total Expense</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="text-center">Expense Tracker</h3>
        </div>

        <div class="card-body">

            <form id="expenseForm">

                <div class="row">

                    <div class="col-md-3">
                        <input
                            type="number"
                            class="form-control"
                            id="amount"
                            placeholder="Expense Amount"
                            required
                        >
                    </div>

                    <div class="col-md-4">
                        <input
                            type="text"
                            class="form-control"
                            id="description"
                            placeholder="Description"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <select
                            class="form-select"
                            id="category"
                            required
                        >
                            <option value="">Choose Category</option>
                            <option>Food</option>
                            <option>Movie</option>
                            <option>Fuel</option>
                            <option>Shopping</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-success w-100">
                            Add Expense
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="mt-4">

        <ul id="expenseList" class="list-group">

        </ul>

    </div>

</div>
<button
    id="logoutBtn"
    class="btn btn-light" onclick="logout()"
>
    Logout
</button>

<script src="script.js"></script>

</body>
</html>
