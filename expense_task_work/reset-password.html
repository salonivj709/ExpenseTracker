<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Expense Tracker</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <main class="login-container">
        <h2>Reset Password</h2>
        <p style="color:#fff; line-height:1.5;">Choose a new password for your Expense Tracker account.</p>
        <form id="resetPasswordForm" class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" placeholder="Enter password again" required>
            <button class="login-btn" type="submit" id="resetButton">Update Password</button>
        </form>
        <p id="resetMessage" role="status" aria-live="polite"></p>
        <a id="loginLink" href="/login.html" class="forgot-password-btn" hidden>Back to Login</a>
    </main>
    <script src="/reset-password.js"></script>
</body>
</html>
