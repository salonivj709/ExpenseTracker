<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
        .status-card { width: min(720px, 92%); }
    </style>
</head>
<body>
<div class="card shadow status-card">
    <div class="card-body text-center p-5" id="statusBox">
        <h1>Checking payment...</h1>
        <p>Please wait.</p>
    </div>
</div>
<script>
const token = localStorage.getItem("token");
const params = new URLSearchParams(window.location.search);
const orderId = params.get("order_id");
const statusBox = document.getElementById("statusBox");

function showSuccess() {
    const user = JSON.parse(localStorage.getItem("user") || "null");
    if (user) {
        user.premium = true;
        localStorage.setItem("user", JSON.stringify(user));
    }
    statusBox.innerHTML = `
        <h1 class="text-success">Transaction successful</h1>
        <p class="fs-5">You are a premium user now. Your Premium Membership is active.</p>
        <a href="Expense.html" class="btn btn-primary">Back to Expense Tracker</a>
    `;
}

function showPending() {
    statusBox.innerHTML = `
        <h1 class="text-warning">Payment Pending</h1>
        <p class="fs-5">Your payment is still being processed. Please check again shortly.</p>
        <a href="Expense.html" class="btn btn-primary">Back to Expense Tracker</a>
    `;
}

function showFailure(message) {
    statusBox.innerHTML = `
        <h1 class="text-danger">TRANSACTION FAILED</h1>
        <p class="fs-5">${message || "Payment was not successful."}</p>
        <a href="Expense.html" class="btn btn-primary">Back to Expense Tracker</a>
    `;
}

async function verifyPayment() {
    if (!token || !orderId) {
        showFailure("Missing login session or order ID.");
        return;
    }

    try {
        const response = await fetch(
            `http://localhost:3000/api/payment/verify/${encodeURIComponent(orderId)}`,
            { headers: { Authorization: token } }
        );

        const result = await response.json();

        if (!response.ok) {
            showFailure(result.message);
            return;
        }

        if (result.status === "SUCCESS") showSuccess();
        else if (result.status === "PENDING") showPending();
        else showFailure(result.message);
    } catch (error) {
        console.error(error);
        showFailure("Unable to verify payment status");
    }
}

verifyPayment();
</script>
</body>
</html>
