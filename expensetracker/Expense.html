<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="text-center">Expense Tracker</h3>
        </div>

        <div class="card-body">

            <form id="expenseForm">

                <div class="row">

                    <div class="col-md-3">
                        <input
                            type="number"
                            class="form-control"
                            id="amount"
                            placeholder="Expense Amount"
                            required
                        >
                    </div>

                    <div class="col-md-4">
                        <input
                            type="text"
                            class="form-control"
                            id="description"
                            placeholder="Description"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <select
                            class="form-select"
                            id="category"
                            required
                        >
                            <option value="">Choose Category</option>
                            <option>Food</option>
                            <option>Movie</option>
                            <option>Fuel</option>
                            <option>Shopping</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-success w-100">
                            Add Expense
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="mt-4">

        <ul id="expenseList" class="list-group">

        </ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
